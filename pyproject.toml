[project]
name = "ecg-filter-lab"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "wfdb>=4.1,<5",
  "pydantic>=2.8,<3",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.vercel.scripts]
build = "npm ci --prefix frontend && npm run build --prefix frontend"
